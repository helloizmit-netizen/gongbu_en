<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<style>html{color-scheme:light only}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>유노를 위한 40일 프로젝트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');

  :root{
    --ink:#20303a;
    --paper:#fbf7ee;
    --card:#ffffff;
    --line:#e3dccb;
    --sky:#3a8fb7;
    --sky-deep:#2b6d8f;
    --leaf:#4a9d6e;
    --leaf-deep:#3a7d57;
    --coral:#e07a5f;
    --coral-deep:#c85f45;
    --gold:#e8b23a;
    --dim:#8a9199;
    --shadow: 0 6px 0 rgba(32,48,58,.08), 0 14px 30px rgba(32,48,58,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Gowun Dodum',system-ui,sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, #fff8e9 0%, var(--paper) 55%);
    color:var(--ink);
    min-height:100%;
    display:flex;justify-content:center;
  }
  .wrap{
    width:100%;max-width:520px;min-height:100dvh;
    padding:18px 18px 30px;
    display:flex;flex-direction:column;
  }
  .brand{font-family:'Jua',sans-serif;letter-spacing:.5px}

  /* ---------- top bar ---------- */
  .top{
    display:flex;align-items:center;gap:10px;margin-bottom:14px;
  }
  .top h1{font-family:'Jua',sans-serif;font-size:20px;font-weight:400;flex:1}
  .top .stat{
    font-size:12px;color:var(--dim);text-align:right;line-height:1.4
  }
  .top .stat b{color:var(--sky-deep);font-family:'Jua',sans-serif;font-size:14px}

  /* ---------- panels ---------- */
  .panel{
    background:var(--card);border:2px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:20px;
  }

  /* ---------- home / chapter select ---------- */
  #home .hero{
    text-align:center;padding:26px 16px 22px;margin-bottom:16px;
    background:linear-gradient(160deg,#eaf6fb, #f6efe0);
    border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
  }
  #home .hero .big{font-family:'Jua',sans-serif;font-size:30px;line-height:1.25}
  #home .hero .sub{color:var(--dim);margin-top:8px;font-size:14px}
  #home .hero .eyebrow{
    font-family:'Jua',sans-serif;font-size:13px;color:var(--sky-deep);
    letter-spacing:1px;margin-bottom:8px
  }
  #home .hero .hero-track{
    height:10px;border-radius:8px;background:#e2ddcf;margin:18px auto 6px;max-width:280px;overflow:hidden
  }
  #home .hero .hero-track i{display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--leaf),var(--gold),var(--coral));transition:.5s}
  #home .hero .hero-count{font-family:'Jua',sans-serif;font-size:12px;color:var(--dim)}
  .seg{
    display:flex;background:#eef3f2;border-radius:14px;padding:5px;gap:5px;margin-bottom:16px
  }
  .seg button{
    flex:1;border:0;background:transparent;padding:10px 6px;border-radius:10px;
    font-family:'Jua',sans-serif;font-size:14px;color:var(--dim);cursor:pointer;transition:.15s
  }
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}

  .section-title{font-family:'Jua',sans-serif;font-size:15px;margin:4px 4px 12px;color:var(--sky-deep)}

  .review-top{
    background:linear-gradient(160deg,#fff1ec,#ffe5db);
    border:2px solid #f3c4b4;border-radius:22px;padding:18px 18px 16px;margin-bottom:16px;
    box-shadow:0 6px 0 rgba(200,95,69,.10), 0 14px 26px rgba(200,95,69,.14)
  }
  .review-top-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .rt-title{font-family:'Jua',sans-serif;font-size:17px;color:var(--coral-deep)}
  .rt-count{font-family:'Jua',sans-serif;font-size:14px;color:#fff;background:var(--coral);
    border-radius:20px;padding:3px 12px}
  .rt-desc{font-size:12px;color:#a86a58;margin-bottom:12px}
  .primary.coral{background:linear-gradient(160deg,var(--coral),var(--coral-deep));
    box-shadow:0 5px 0 var(--coral-deep),0 10px 20px rgba(200,95,69,.3);margin-top:0}
  .primary.coral:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-deep)}

  .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
  .chip{
    position:relative;border:2px solid var(--line);background:var(--card);border-radius:16px;
    padding:12px 8px 11px;cursor:pointer;transition:.15s;text-align:left;overflow:hidden
  }
  .chip:active{transform:translateY(2px)}
  .chip .d{font-family:'Jua',sans-serif;font-size:16px}
  .chip .t{font-size:11px;color:var(--dim);margin-top:2px;height:26px;overflow:hidden;line-height:1.25}
  .chip .bar{height:6px;border-radius:4px;background:#eceadf;margin-top:9px;overflow:hidden}
  .chip .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--leaf-deep));width:0}
  .chip.done{border-color:var(--leaf)}
  .chip .badge{position:absolute;top:8px;right:8px;font-size:14px;opacity:0;transition:.2s}
  .chip.done .badge{opacity:1}

  .primary{
    display:block;width:100%;border:0;border-radius:18px;padding:16px;margin-top:16px;
    font-family:'Jua',sans-serif;font-size:17px;color:#fff;cursor:pointer;
    background:linear-gradient(160deg,var(--sky),var(--sky-deep));
    box-shadow:0 5px 0 var(--sky-deep), 0 10px 20px rgba(43,109,143,.3);transition:.12s
  }
  .primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sky-deep)}
  .primary.leaf{background:linear-gradient(160deg,var(--leaf),var(--leaf-deep));box-shadow:0 5px 0 var(--leaf-deep),0 10px 20px rgba(58,125,87,.3)}
  .primary[disabled]{opacity:.4;box-shadow:none;transform:none;cursor:not-allowed}

  .row-btns{display:flex;gap:10px;margin-top:14px}
  .ghost{
    flex:1;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:13px;
    font-family:'Jua',sans-serif;font-size:14px;color:var(--ink);cursor:pointer
  }
  .ghost:active{transform:translateY(2px)}

  .mode-note{font-size:12px;color:var(--dim);text-align:center;margin-top:12px;line-height:1.5}

  /* ---------- quiz ---------- */
  #quiz{display:none;flex-direction:column;flex:1}
  .qtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .iconbtn{
    border:2px solid var(--line);background:var(--card);border-radius:12px;width:42px;height:42px;
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto
  }
  .iconbtn:active{transform:translateY(2px)}
  .progress{flex:1;height:12px;background:#eceadf;border-radius:8px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--coral));transition:.3s}
  .qcount{font-family:'Jua',sans-serif;font-size:13px;color:var(--dim);flex:0 0 auto}

  .card-q{
    flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    background:var(--card);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
    padding:34px 22px;text-align:center;margin-bottom:16px;min-height:180px;position:relative
  }
  .card-q .tag{position:absolute;top:16px;left:18px;font-size:11px;color:var(--dim);font-family:'Jua',sans-serif}
  .card-q .streak{position:absolute;top:14px;right:16px;font-size:13px;color:var(--coral);font-family:'Jua',sans-serif}
  .prompt-label{font-size:12px;color:var(--dim);margin-bottom:10px;letter-spacing:1px}
  .prompt-hint{font-size:14px;color:var(--sky-deep);margin-top:12px;line-height:1.5;
    background:#eef6fa;border-radius:12px;padding:8px 14px;max-width:340px;word-break:keep-all}
  .prompt-hint:empty{display:none}
  .prompt{font-family:'Jua',sans-serif;font-size:34px;line-height:1.3;word-break:keep-all}
  /* 품사 배지 */
  .posbadge{
    display:inline-block;font-family:'Gowun Dodum',sans-serif;font-size:13px;line-height:1;
    padding:5px 9px;border-radius:8px;margin-right:9px;vertical-align:middle;
    background:rgba(255,255,255,.10);color:#9fb6c9;border:1px solid rgba(255,255,255,.16);
  }
  .posbadge.sm{font-size:11px;padding:4px 7px;margin-right:7px;flex:0 0 auto}
  .posbadge:empty{display:none}
  .prompt.small{font-size:26px}
  .ratebtn{margin-left:8px;font-size:14px;opacity:.85}
  .reward{margin:18px 0 6px;padding:16px;border-radius:18px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
  .reward-cap{font-family:'Jua',sans-serif;font-size:15px;color:#ffd66b;margin-bottom:12px}
  .reward img{width:100%;max-width:260px;aspect-ratio:3/4;object-fit:cover;
    border-radius:14px;display:block;margin:0 auto;background:rgba(255,255,255,.06)}
  .reward-name{font-family:'Jua',sans-serif;font-size:20px;margin-top:12px}
  .reward-msg{font-size:15px;color:#cfe0ec;margin-top:6px;line-height:1.55;word-break:keep-all}
  .rewardMore{margin-top:12px;font-size:14px;padding:9px 14px}
  .syn-entry{margin:16px 0;padding:16px;border-radius:18px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
  .syn-entry-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .se-title{font-family:'Jua',sans-serif;font-size:16px}
  .se-count{font-size:12px;color:var(--dim);border:1px solid rgba(255,255,255,.18);
    border-radius:20px;padding:3px 10px}
  .se-desc{font-size:13px;color:var(--dim);margin-bottom:12px;word-break:keep-all}
  .se-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .se-btns .primary{margin:0;padding:12px;font-size:14px}
  .syn-h{font-family:'Jua',sans-serif;font-size:18px}
  .syngroup{margin-bottom:14px;padding:16px;border-radius:16px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
  .syngroup h3{font-family:'Jua',sans-serif;font-size:17px;margin-bottom:8px;color:#ffd66b}
  .syngroup .note{font-size:14px;color:#cfe0ec;line-height:1.6;word-break:keep-all;margin-bottom:12px}
  .synrow{display:flex;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);align-items:baseline}
  .synrow .e{font-weight:bold;min-width:96px;color:#eaf4fb}
  .synrow .m{font-size:13px;color:#a9bccb;word-break:keep-all;flex:1}
  .opt.picked{border-color:var(--sky);background:rgba(58,143,183,.18)}
  .syncard{margin-top:12px;padding:14px;border-radius:14px;text-align:left;
    background:rgba(255,214,107,.08);border:1px solid rgba(255,214,107,.30)}
  .syncard h4{font-family:'Jua',sans-serif;font-size:14px;color:#ffd66b;margin-bottom:7px}
  .syncard .note{font-size:13px;color:#dfeaf2;line-height:1.55;word-break:keep-all}
  .syncard .row{display:flex;gap:8px;margin-top:7px;font-size:13px;align-items:baseline}
  .syncard .row b{min-width:88px;color:#fff;font-weight:bold}
  .syncard .row span{color:#b9cbd8;word-break:keep-all;flex:1}
  .pron{margin-top:10px;font-family:'Gowun Dodum',sans-serif;font-size:15px;
        color:#8fa6b8;letter-spacing:.5px}
  .pron b{font-weight:normal;color:#c9d8e4}
  .speak{margin-top:14px;border:2px solid var(--line);background:#f4f9fb;border-radius:12px;
    padding:8px 16px;font-size:13px;color:var(--sky-deep);cursor:pointer;font-family:'Gowun Dodum'}

  .options{display:grid;gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--card);border-radius:16px;padding:15px 16px;
    font-family:'Gowun Dodum';font-size:16px;text-align:left;cursor:pointer;transition:.12s;
    display:flex;align-items:center;gap:10px
  }
  .opt .num{
    width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:#eef3f2;color:var(--dim);
    display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:13px
  }
  .opt:active{transform:translateY(2px)}
  .opt.correct{border-color:var(--leaf);background:#eaf7ef}
  .opt.correct .num{background:var(--leaf);color:#fff}
  .opt.wrong{border-color:var(--coral);background:#fceee9}
  .opt.wrong .num{background:var(--coral);color:#fff}
  .opt.disabled{pointer-events:none;opacity:.55}
  .opt.disabled.correct,.opt.disabled.wrong{opacity:1}

  /* typing mode */
  .type-wrap{display:grid;gap:12px}
  .type-wrap input{
    border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px;
    font-size:20px;font-family:'Gowun Dodum';text-align:center;color:var(--ink);width:100%
  }
  .type-wrap input:focus{outline:none;border-color:var(--sky)}
  .type-wrap input.correct{border-color:var(--leaf);background:#eaf7ef}
  .type-wrap input.wrong{border-color:var(--coral);background:#fceee9}
  .answerline{text-align:center;font-family:'Jua',sans-serif;font-size:18px;min-height:24px}
  .answerline .a{color:var(--leaf-deep)}

  .feedback{
    text-align:center;font-family:'Jua',sans-serif;font-size:16px;min-height:26px;margin-top:14px;
  }
  .feedback.good{color:var(--leaf-deep)}
  .feedback.bad{color:var(--coral-deep)}

  .nextbtn{
    display:none;width:100%;border:0;border-radius:16px;padding:15px;margin-top:12px;
    font-family:'Jua',sans-serif;font-size:16px;color:#fff;cursor:pointer;
    background:linear-gradient(160deg,var(--leaf),var(--leaf-deep));
    box-shadow:0 4px 0 var(--leaf-deep)
  }
  .nextbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf-deep)}

  /* ---------- result ---------- */
  #result{display:none;text-align:center}
  #result .medal{font-size:64px;margin:10px 0}
  #result h2{font-family:'Jua',sans-serif;font-size:26px;margin-bottom:6px}
  #result .line{color:var(--dim);margin-bottom:18px}
  .scorebox{display:flex;gap:12px;margin:18px 0}
  .scorebox .b{
    flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 8px
  }
  .scorebox .b .n{font-family:'Jua',sans-serif;font-size:26px}
  .scorebox .b .k{font-size:12px;color:var(--dim);margin-top:2px}
  .scorebox .b.g .n{color:var(--leaf-deep)}
  .scorebox .b.r .n{color:var(--coral-deep)}
  .wronglist{text-align:left;margin:6px 0 4px}
  .wronglist .wtitle{font-family:'Jua',sans-serif;font-size:14px;color:var(--coral-deep);margin-bottom:10px}
  .wrow{
    display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border:2px solid var(--line);
    border-radius:14px;margin-bottom:8px;background:var(--card)
  }
  .wrow .e{font-family:'Jua',sans-serif}
  .wrow .k{color:var(--dim);font-size:14px;text-align:right}

  .mini-row{display:flex;gap:8px;margin-top:18px;justify-content:center;flex-wrap:wrap}
  .mini{
    border:2px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;
    font-family:'Gowun Dodum';font-size:12px;color:var(--dim);cursor:pointer
  }
  .mini:active{transform:translateY(2px)}
  .mini.danger{color:var(--coral-deep)}

  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- ================= HOME ================= -->
  <section id="home">
    <div class="hero">
      <div class="eyebrow">유노를 위한 40일 프로젝트</div>
      <div class="big">유노야, 이건 너만을 위한 거야 💪</div>
      <div class="sub">40일 뒤엔 웃으면서<br>"쉬운 단어였네!" 할 수 있을 거야<br>화이팅!! 사랑한다 ❤️</div>
      <div class="hero-track"><i id="heroFill"></i></div>
      <div class="hero-count" id="heroCount"></div>
    </div>

    <!-- 틀린 단어 집중 학습 (최상단 강조) -->
    <div class="review-top hidden" id="reviewTop">
      <div class="review-top-head">
        <span class="rt-title">🔥 틀린 단어 집중 학습</span>
        <span class="rt-count" id="reviewCount">0개</span>
      </div>
      <div class="rt-desc">두 번 연속 맞히면 목록에서 빠져요</div>
      <button class="primary coral" id="reviewBtn">틀린 단어 복습 시작하기</button>
    </div>

    <div class="seg" id="modeSeg">
      <button data-mode="ek" class="on">영어 → 뜻</button>
      <button data-mode="ke">뜻 → 영어</button>
      <button data-mode="type">직접 쓰기</button>
    </div>

    <div class="syn-entry" id="synEntry">
      <div class="syn-entry-head">
        <span class="se-title">🔗 헷갈리는 단어 정리</span>
        <span class="se-count" id="synCount">0묶음</span>
      </div>
      <div class="se-desc">slim / thin / skinny 처럼 뜻이 겹치는 단어를 한 번에</div>
      <div class="se-btns">
        <button class="primary leaf" id="synStudyBtn">뜻 차이 보기 📖</button>
        <button class="primary" id="synQuizBtn">모두 고르기 퀴즈 ✅</button>
      </div>
    </div>

    <div class="section-title" id="secTitle">챕터를 골라요</div>
    <div class="chips" id="chips"></div>

    <div class="mode-note" id="homeNote"></div>

    <div class="mini-row">
      <button class="mini" id="exportBtn">진행상황 백업</button>
      <button class="mini" id="importBtn">백업 불러오기</button>
      <button class="mini danger" id="resetBtn">기록 초기화</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </section>

  <!-- ================= 유의어 학습 ================= -->
  <section id="syn">
    <div class="qtop">
      <button class="iconbtn" id="synBackBtn">←</button>
      <div class="syn-h">헷갈리는 단어 정리</div>
    </div>
    <div id="synList"></div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section id="quiz">
    <div class="qtop">
      <button class="iconbtn" id="backBtn">←</button>
      <div class="progress"><i id="progFill"></i></div>
      <div class="qcount" id="qCount">0/0</div>
    </div>

    <div class="card-q">
      <div class="tag" id="qTag"></div>
      <div class="streak" id="qStreak"></div>
      <div class="prompt-label" id="promptLabel">영어 단어</div>
      <div class="prompt" id="prompt">—</div>
      <div class="prompt-hint" id="promptHint"></div>
      <button class="speak hidden" id="speakBtn">🔊 발음 듣기</button>
      <button class="speak ratebtn hidden" id="rateBtn">🚶 느리게</button>
      <div class="pron hidden" id="pronLine"></div>
    </div>

    <div class="options" id="options"></div>

    <div class="type-wrap hidden" id="typeWrap">
      <input id="typeInput" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="영어로 입력">
      <div class="answerline" id="answerLine"></div>
      <div class="syncard hidden" id="synCard"></div>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="nextbtn" id="nextBtn">다음 →</button>
  </section>

  <!-- ================= RESULT ================= -->
  <section id="result">
    <div class="medal" id="medal">🎉</div>
    <h2 id="resTitle">잘했어요!</h2>
    <div class="line" id="resLine"></div>

    <div class="scorebox">
      <div class="b g"><div class="n" id="rCorrect">0</div><div class="k">맞은 단어</div></div>
      <div class="b r"><div class="n" id="rWrong">0</div><div class="k">틀린 단어</div></div>
      <div class="b"><div class="n" id="rRate">0%</div><div class="k">정답률</div></div>
    </div>

    <div class="reward hidden" id="rewardBox">
      <div class="reward-cap" id="rewardCap"></div>
      <img id="rewardImg" alt="" />
      <div class="reward-name" id="rewardName"></div>
      <div class="reward-msg" id="rewardMsg"></div>
      <button class="ghost rewardMore" id="rewardMore">다른 사진 보기 🔀</button>
    </div>

    <div class="wronglist" id="wrongList"></div>

    <button class="primary leaf hidden" id="retryWrong">틀린 단어 다시 풀기</button>

/* =====================================================================
   STATE + STORAGE
   ===================================================================== */
const KEY='wm-progress-v1';
// wrongPool[eng] = { kor, hint, correct }
//   correct = 복습에서 연속으로 맞힌 횟수. 2회가 되면 목록에서 자동 제거.
let store={ mastered:{}, wrongPool:{} };

// Saves to the device via localStorage (works when the file is opened in Safari /
// added to the Home Screen). Falls back to window.storage if present.
async function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(!raw){ try{const r=await window.storage.get(KEY);if(r&&r.value)raw=r.value;}catch(e){} }
  if(raw){ try{store=JSON.parse(raw);}catch(e){} }
  if(!store.mastered)store.mastered={};
  if(!store.wrongPool)store.wrongPool={};
  // 예전 형식({eng:"뜻"}) → 새 형식({eng:{kor,hint,correct}}) 자동 변환
  for(const eng in store.wrongPool){
    const v=store.wrongPool[eng];
    if(typeof v==='string'){ store.wrongPool[eng]={kor:v,hint:findHint(eng),correct:0}; }
    else if(v && typeof v.correct!=='number'){ v.correct=0; }
    if(store.wrongPool[eng] && !store.wrongPool[eng].pos){ store.wrongPool[eng].pos=findPos(eng); }
  }
}
// 단어의 힌트를 전체 DAYS에서 찾아 준다 (복습 카드에도 힌트를 쓰기 위해)
function findWord(eng){
  for(const day in DAYS){
    for(const w of DAYS[day].words){ if(w[0]===eng) return w; }
  }
  return null;
}
function findPos(eng){
  for(const day in DAYS){
    for(const w of DAYS[day].words){ if(w[0]===eng) return w[3]||''; }
  }
  return '';
}
function findHint(eng){
  for(const day in DAYS){
    for(const w of DAYS[day].words){ if(w[0]===eng) return w[2]||''; }
  }
  return '';
}
async function save(){
  const data=JSON.stringify(store);
  try{ localStorage.setItem(KEY,data); }catch(e){}
  try{ if(window.storage&&window.storage.set) await window.storage.set(KEY,data,false); }catch(e){}
}

const $=id=>document.getElementById(id);

function masteredCount(day){
  const m=store.mastered[day]||{};
  return DAYS[day].words.filter(w=>m[w[0]]).length;
}
function renderChips(){
  const sc=$('synCount'); if(sc)sc.textContent=SYNONYM_GROUPS.length+'묶음';
  const box=$('chips');box.innerHTML='';
  Object.keys(DAYS).forEach(day=>{
    const d=DAYS[day];const total=d.words.length;const got=masteredCount(day);
    const pct=Math.round(got/total*100);
    const el=document.createElement('button');
    el.className='chip'+(got===total?' done':'');
    el.innerHTML=`<span class="badge">✅</span>
      <div class="d">${day}일</div>
      <div class="t">${d.title}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>`;
    el.onclick=()=>startQuiz(day);
    box.appendChild(el);
  });
  // 틀린 단어 집중 학습 카드 (최상단)
  const wrongN=Object.keys(store.wrongPool).length;
  const rt=$('reviewTop');
  if(wrongN>0){
    rt.classList.remove('hidden');
    $('reviewCount').textContent=`${wrongN}개`;
  }else{
    rt.classList.add('hidden');
  }
  // note
  const totalWords=Object.values(DAYS).reduce((a,d)=>a+d.words.length,0);
  const totalGot=Object.keys(DAYS).reduce((a,day)=>a+masteredCount(day),0);
  $('homeNote').innerHTML=`지금까지 <b>${totalGot}</b> / ${totalWords} 단어를 익혔어요`;
  // hero progress: how many of 40 days are complete
  const doneDays=Object.keys(DAYS).filter(day=>masteredCount(day)===DAYS[day].words.length).length;
  const pct=Math.round(totalGot/totalWords*100);
  $('heroFill').style.width=pct+'%';
  $('heroCount').textContent=`40일 중 ${doneDays}일 완성 · 전체 ${pct}%`;
}

/* =====================================================================
   QUIZ ENGINE
   ===================================================================== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function startQuiz(day){
  const words=DAYS[day].words;
  const m=store.mastered[day]||{};
  // learning order: unmastered first, then a few mastered for review
  const unmastered=words.filter(w=>!m[w[0]]);
  const masteredW=words.filter(w=>m[w[0]]);
  let queue=shuffle(unmastered);
  // sprinkle in up to 5 mastered words to keep them fresh
  queue=queue.concat(shuffle(masteredW).slice(0,5));
  if(queue.length===0)queue=shuffle(words); // all mastered -> full review
  beginSession({day,label:`${day}일 · ${DAYS[day].title}`,words,queue});
}
function startReview(){
  const entries=Object.entries(store.wrongPool).map(([e,v])=>[e,v.kor,v.hint||'',v.pos||findPos(e)]);
  if(!entries.length)return;
  beginSession({day:null,label:`틀린 단어 복습`,words:entries,queue:shuffle(entries),review:true});
}
function beginSession(cfg){
  session={
    ...cfg,
    idx:0,total:cfg.queue.length,
    correct:0,wrong:0,streak:0,
    wrongItems:[],            // [eng,kor]
    answered:false
  };
  show('quiz');
  renderQuestion();
}

const SYN_MAP=(()=>{const m={};SYNONYM_GROUPS.forEach((g,i)=>g.w.forEach(w=>{(m[w]||(m[w]=[])).push(i);}));return m;})();

function sameMeaning(a,b){

  return ga.some(i=>gb.includes(i));

  const ga=SYN_MAP[a],gb=SYN_MAP[b];
  if(!ga||!gb)return false;
  return ga.some(i=>gb.includes(i)&&!SYNONYM_GROUPS[i].x);
}

function POSAB(p){return {'명사':'명','동사':'동','형용사':'형','부사':'부','숙어':'숙'}[p]||'';}

/* 자모 분해: 유의어(기쁜/기쁨/기뻐) 판별용 */
function jamo(str){
  let out='';
  const L="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".split('');
  const V="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ".split('');
  const T=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  for(const ch of str){
    const c=ch.charCodeAt(0)-0xAC00;
    if(c>=0&&c<11172){out+=L[Math.floor(c/588)]+V[Math.floor((c%588)/28)]+T[c%28];}
    else out+=ch;
  }
  return out;
}
/* 두 뜻이 사실상 같은 말인지: 자모 앞부분이 3개 이상 겹치면 유의어로 본다 */
function tooSimilar(a,b){
  const ja=jamo(a.replace(/[\s,()~·]/g,'')), jb=jamo(b.replace(/[\s,()~·]/g,''));
  if(!ja||!jb)return false;
  let n=0; while(n<ja.length&&n<jb.length&&ja[n]===jb[n])n++;
  if(n>=3)return true;
  // 한쪽이 다른 쪽을 통째로 포함해도 유의어 (예: 기쁨 / 큰 기쁨)
  const sa=a.replace(/[\s,()~·]/g,''), sb=b.replace(/[\s,()~·]/g,'');
  if(sa.length>=2&&sb.includes(sa))return true;
  if(sb.length>=2&&sa.includes(sb))return true;
  return false;
}
/* 정답 단어와 보기 후보가 뜻이 겹치는지 (대표뜻+상세뜻 모두 비교) */
function clashes(correctW, cand){
  // 1) 지정된 유의어 묶음
  if(sameMeaning(correctW[0],cand[0]))return true;
  // 2) 대표뜻이 완전히 같은 경우
  if(correctW[1]===cand[1])return true;
  // 3) 글자가 비슷한 경우
  const A=[correctW[1],correctW[2]||''].filter(Boolean);
  const B=[cand[1],cand[2]||''].filter(Boolean);
  for(const a of A)for(const b of B)if(tooSimilar(a,b))return true;
  return false;
}

/* 보기 뽑기 공통: 같은 품사 우선 + 유의어 제외 */
function buildOptions(correctW, pool, useEng){
  const key = useEng?0:1;
  const correctVal = correctW[key];
  const cpos = correctW[3]||'';
  const picked=[correctW];
  const vals=new Set([correctVal]);
  const ok=w=>w[key]&&!vals.has(w[key])&&!clashes(correctW,w);

  const everything = Object.values(DAYS).flatMap(d=>d.words);
  // 1순위: 같은 날 + 같은 품사, 2순위: 전체 + 같은 품사, 3순위: 같은 날 아무거나, 4순위: 전체
  const tiers=[
    shuffle(pool).filter(w=>(w[3]||'')===cpos),
    shuffle(everything).filter(w=>(w[3]||'')===cpos),
    shuffle(pool),
    shuffle(everything)
  ];
  for(const tier of tiers){
    for(const w of tier){
      if(picked.length>=4)break;
      if(ok(w)){picked.push(w);vals.add(w[key]);}
    }
    if(picked.length>=4)break;
  }
  return shuffle(picked);
}

/* 정답률에 맞는 등급의 사진 중 무작위 1장.
   파일이 없거나 로딩에 실패하면 보상 영역만 조용히 숨긴다. */
let lastRewardPhoto='';
let lastRewardRate=0;
function rewardPool(rate){
  const tier=REWARD_TIERS.filter(t=>rate>=t.min).sort((a,b)=>b.min-a.min)[0];
  if(!tier)return {pool:[],cap:''};
  const pool=[];
  for(const m of MEMBERS){
    if(!tier.keys.includes(m.key))continue;
    for(const ph of m.photos)pool.push({m,ph});
  }
  return {pool,cap:tier.cap};
}
function showReward(rate){
  if(typeof rate==='number')lastRewardRate=rate;
  const box=$('rewardBox');
  const {pool,cap}=rewardPool(lastRewardRate);
  if(!pool.length){ box.classList.add('hidden'); return; }
  let pick=pool[Math.random()*pool.length|0];
  if(pool.length>1){let g=0;while(pick.ph===lastRewardPhoto&&g++<10)pick=pool[Math.random()*pool.length|0];}
  lastRewardPhoto=pick.ph;

  const img=$('rewardImg');
  img.onerror=()=>{box.classList.add('hidden');};
  img.onload =()=>{box.classList.remove('hidden');};
  $('rewardCap').textContent=cap;
  $('rewardName').textContent=pick.m.name||'';
  $('rewardMsg').textContent=pick.m.message||'';
  img.alt=(pick.m.name||'')+' 사진';
  box.classList.add('hidden');
  img.src=REWARD_DIR+pick.ph;
  $('rewardMore').style.display = pool.length>1 ? '' : 'none';
}

/* [기능2] 오답 시 뜻 차이 카드 */
/* 고른 답이 정답과 사실상 같은 뜻이면 정답으로 인정한다.
   (유의어는 애초에 같은 문제에 안 나오지만, 데이터가 늘어날 때를 위한 안전망) */
function judgePick(selVal, correctVal, useEng){
  if(selVal===correctVal) return {ok:true, syn:false, alt:null};
  if(useEng){
    // 영어를 고르는 모드: 두 영어 단어가 같은 묶음인가
    if(interchangeable(selVal, correctVal)) return {ok:true, syn:true, alt:selVal};
  }else{
    // 한국어 뜻을 고르는 모드: 그 뜻을 가진 영어 단어가 정답과 같은 묶음인가
    for(const day in DAYS){
      for(const w of DAYS[day].words){
        if(w[1]!==selVal) continue;
        if(w[0]===correctVal) continue;
        if(interchangeable(w[0], correctVal)) return {ok:true, syn:true, alt:w[0]};
      }
    }
  }
  return {ok:false, syn:false, alt:null};
}

}

/* [기능1] 모두 고르기 퀴즈: 같은 뜻인 단어를 전부 고르기 */
function startSynQuiz(){
  const usable=SYNONYM_GROUPS.filter(g=>g.w.length>=2&&g.w.every(findWord));
  if(!usable.length){ alert('아직 준비된 묶음이 없어요.'); return; }
  session={ synMode:true, queue:shuffle(usable).slice(0,12), idx:0,
            total:Math.min(12,usable.length), correct:0, wrong:0, streak:0,
            wrongItems:[], answered:false, day:null, label:'헷갈리는 단어 모두 고르기' };
  session.total=session.queue.length;
  show('quiz'); renderSynQuestion();
}
function renderSynQuestion(){
  const s=session, g=s.queue[s.idx];
  s.answered=false; s.picked=new Set();
  if(s.autoTimer){clearTimeout(s.autoTimer);s.autoTimer=null;}
  $('progFill').style.width=(s.idx/s.total*100)+'%';
  $('qCount').textContent=`${s.idx+1}/${s.total}`;
  $('qTag').textContent=s.label;
  $('qStreak').textContent=s.streak>=2?`🔥 연속 ${s.streak}`:'';
  $('feedback').textContent=''; $('feedback').className='feedback';
  $('answerLine').textContent=''; $('synCard').classList.add('hidden');
  $('promptHint').textContent='💡 해당하는 것을 모두 고른 뒤 확인을 누르세요';
  $('pronLine').classList.add('hidden');
  $('speakBtn').classList.add('hidden'); $('rateBtn').classList.add('hidden');
  $('typeWrap').classList.add('hidden');
  $('promptLabel').textContent='이 뜻을 가진 단어를 모두 고르면?';
  $('prompt').textContent=g.t;
  $('prompt').className='prompt'+(g.t.length>10?' small':'');

  // 정답(같은 묶음) + 오답(다른 묶음/단어)
  const correct=g.w.slice();
  const others=[];
  const all=Object.values(DAYS).flatMap(d=>d.words).map(w=>w[0]);
  for(const e of shuffle(all)){
    if(others.length>=Math.max(2,6-correct.length))break;
    if(correct.includes(e))continue;
    if(correct.some(c=>sameMeaning(c,e)))continue;
    if(others.includes(e))continue;
    others.push(e);
  }
  const opts=shuffle(correct.concat(others));
  const box=$('options'); box.classList.remove('hidden'); box.innerHTML='';
  opts.forEach((e,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.val=e;
    const n=document.createElement('span'); n.className='num'; n.textContent=i+1;
    const t=document.createElement('span'); t.textContent=e;
    const k=document.createElement('span'); k.className='posbadge sm';
    const wd=findWord(e); k.textContent=wd?wd[1]:'';
    b.appendChild(n); b.appendChild(t); b.appendChild(k);
    b.onclick=()=>{
      if(s.answered)return;
      if(s.picked.has(e)){s.picked.delete(e);b.classList.remove('picked');}
      else{s.picked.add(e);b.classList.add('picked');}
      $('nextBtn').style.display=s.picked.size?'block':'none';
      $('nextBtn').textContent='확인하기 ✅';
    };
    box.appendChild(b);
  });
  $('nextBtn').style.display='none';
}
function checkSynAnswer(){
  const s=session, g=s.queue[s.idx];
  s.answered=true;
  const correct=new Set(g.w);
  let ok=true;
  document.querySelectorAll('.opt').forEach(o=>{
    const v=o.dataset.val; o.classList.add('disabled');
    const should=correct.has(v), did=s.picked.has(v);
    if(should)o.classList.add('correct');
    if(did&&!should){o.classList.add('wrong');ok=false;}
    if(should&&!did)ok=false;
  });
  const fb=$('feedback');
  if(ok){ s.correct++; s.streak++; fb.textContent='정확해요! 👍'; fb.className='feedback good'; }
  else  { s.wrong++; s.streak=0; fb.textContent='아쉬워요! 초록색이 모두 정답이에요.'; fb.className='feedback bad'; }
  renderSynCard(g.w[0]);
  $('progFill').style.width=((s.idx+1)/s.total*100)+'%';
  $('nextBtn').style.display='block';
  $('nextBtn').textContent=(s.idx+1>=s.total)?'결과 보기 →':'다음 →';
}

function pick(btn,selVal,correctVal,useEng){
  if(session.answered)return;session.answered=true;
  const s=session;
  const j=judgePick(selVal,correctVal,useEng);
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
  document.querySelectorAll('.opt').forEach(o=>{
    if(o.dataset.val===correctVal)o.classList.add('correct');
  });
  if(j.ok){btn.classList.add('correct');}else{btn.classList.add('wrong');}

function checkTyping(){
  if(session.answered)return;
  const s=session;const inp=$('typeInput');
  const guess=inp.value.trim().toLowerCase();
  if(!guess)return;
  session.answered=true;inp.disabled=true;
  const correct=s.current.eng.toLowerCase();
  let isCorrect=guess===correct, synAlt=null;
  if(!isCorrect){
    // 같은 뜻 묶음의 다른 단어를 썼다면 정답으로 인정
    for(const g of synGroupsOf(s.current.eng)){
      if(g.x) continue; // 한글만 같은 주의 묶음은 인정하지 않음
      const m=g.w.find(w=>w.toLowerCase()===guess);
      if(m){ isCorrect=true; synAlt=m; break; }
    }
  }
  inp.classList.add(isCorrect?'correct':'wrong');
  $('answerLine').innerHTML=isCorrect?'':`정답: <span class="a">${s.current.eng}</span>`;
  finalizeAnswer(isCorrect, synAlt);
}

function finalizeAnswer(isCorrect, synAlt){
  const s=session,eng=s.current.eng,kor=s.current.kor,hint=s.current.hint||findHint(eng);
  const fb=$('feedback');
  s.synAccepted=!!synAlt;
  if(isCorrect){
    s.correct++;s.streak++;
    fb.textContent=['정답! 👍','좋아요! ✨','완벽해요! 🌟','맞았어요! 🎯'][Math.random()*4|0];
    fb.className='feedback good';
    if(synAlt){
      // 유의어를 골라도 정답으로 인정하되, 차이는 짚고 넘어간다
      fb.textContent=`둘 다 맞아요! "${synAlt}"도 비슷한 뜻이에요 ✅ (다만 차이가 있어요)`;
      fb.className='feedback good';
    }
    // 챕터 학습에서 맞히면 mastered 표시
    if(s.day!=null){if(!store.mastered[s.day])store.mastered[s.day]={};store.mastered[s.day][eng]=true;}
    // 틀린 단어 목록에 있으면 정답 횟수를 올리고, 2번 맞히면 목록에서 제거
    if(store.wrongPool[eng]){
      store.wrongPool[eng].correct=(store.wrongPool[eng].correct||0)+1;
      if(store.wrongPool[eng].correct>=2){
        delete store.wrongPool[eng];
        fb.textContent='2번 연속 정답! 목록에서 빼줄게 ✅';
      }else{
        fb.textContent='한 번 더 맞히면 통과! (1/2) 💪';
      }
    }
  }else{
    s.wrong++;s.streak=0;
    const _pr=findPron(eng);
    fb.textContent=`아쉬워요! "${eng}"${_pr?' ['+_pr+']':''} = (${s.current.pos||findPos(eng)}) ${kor}`;
    fb.className='feedback bad';
    s.wrongItems.push([eng,kor,hint]);
    // 틀린 단어 목록에 추가(또는 정답 횟수 0으로 리셋 → 다시 2번 맞혀야 함)
    store.wrongPool[eng]={kor,hint,pos:s.current.pos||findPos(eng),correct:0};
    // 같은 뜻 묶음의 단어도 함께 복습 대상에 넣어 헷갈린 무리를 통째로 잡는다
    let _added=0;
    for(const g of synGroupsOf(eng)){
      for(const sw of g.w){
        if(sw===eng||store.wrongPool[sw])continue;
        const info=findWord(sw); if(!info)continue;
        store.wrongPool[sw]={kor:info[1],hint:info[2]||'',pos:info[3]||'',correct:0};
        _added++;
      }
    }
    if(_added)fb.textContent+=`  (헷갈리는 ${_added}개도 복습에 추가)`;
    // un-master so it comes back
    if(s.day!=null&&store.mastered[s.day])delete store.mastered[s.day][eng];
  }
  save();

  if(isCorrect && s.synAccepted){
    // 유의어로 인정된 경우: 설명을 읽을 수 있게 자동으로 넘기지 않는다
    renderSynCard(eng);
    $('nextBtn').style.display='block';
    $('nextBtn').textContent = (s.idx+1>=s.total)?'결과 보기 →':'다음 →';
  }else if(isCorrect){
    // 정답이면 잠깐 보여준 뒤 자동으로 다음 문제로
    $('synCard').classList.add('hidden');
    $('nextBtn').style.display='none';
    session.autoTimer=setTimeout(()=>{ session.autoTimer=null; goNext(); }, 700);
  }else{
    // 틀리면 정답을 확인하도록 버튼으로 넘어가기
    renderSynCard(eng);
    $('nextBtn').style.display='block';
    $('nextBtn').textContent = (s.idx+1>=s.total)?'결과 보기 →':'다음 →';
  }
}

function goNext(){
  const s=session;
  if(s.autoTimer){clearTimeout(s.autoTimer);s.autoTimer=null;}
  s.idx++;
  if(s.idx>=s.total){showResult();}
  else{ s.synMode?renderSynQuestion():renderQuestion(); }
}

$('nextBtn').onclick=()=>{
  if(session&&session.synMode&&!session.answered){ checkSynAnswer(); return; }
  goNext();
};
$('typeInput')&&$('typeInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){if(session.answered){goNext();}else{checkTyping();}}
});
document.addEventListener('keydown',e=>{
  if($('quiz').style.display==='flex'&&mode!=='type'&&!session?.answered){
    if(['1','2','3','4'].includes(e.key)){
      const opt=document.querySelectorAll('.opt')[+e.key-1];if(opt)opt.click();
    }
  }
  if(e.key==='Enter'&&session?.answered){goNext();}
});

$('backBtn').onclick=()=>{
  if(session&&session.autoTimer){clearTimeout(session.autoTimer);session.autoTimer=null;}
  if(confirm('그만두고 챕터 선택으로 갈까요?')){show('home');renderChips();}
};

/* =====================================================================
   RESULT
   ===================================================================== */
function showResult(){
  const s=session;show('result');
  $('progFill').style.width='100%';
  const rate=Math.round(s.correct/s.total*100);
  $('rCorrect').textContent=s.correct;
  $('rWrong').textContent=s.wrong;
  $('rRate').textContent=rate+'%';
  let medal,title,line;
  if(rate===100){medal='🏆';title='유노야!! 100점 축하해!! 💖';line='한 개도 안 틀렸어. 진짜 최고야! 사랑해!';}
  else if(rate>=80){medal='🎉';title='유노 아주 잘했어!';line='조금만 더 하면 완벽해.';}
  else if(rate>=50){medal='💪';title='유노 잘하고 있어!';line='틀린 단어만 다시 풀어보자.';}
  else{medal='🌱';title='좋은 시작이야!';line='반복하면 금방 외워져. 파이팅!';}
  $('medal').textContent=medal;$('resTitle').textContent=title;$('resLine').textContent=line;

  // 만점이면 보상 사진
  if(s.total>0){ showReward(rate); } else { $('rewardBox').classList.add('hidden'); }

  const wl=$('wrongList');
  if(s.wrongItems.length){
    wl.innerHTML='<div class="wtitle">📌 다시 볼 단어</div>'+
      s.wrongItems.map(([e,k])=>`<div class="wrow"><span class="e">${e}</span><span class="k">${k}</span></div>`).join('');
    $('retryWrong').classList.remove('hidden');
  }else{
    wl.innerHTML='';$('retryWrong').classList.add('hidden');
  }
  renderChips();
}
$('retryWrong').onclick=()=>{
  const items=session.wrongItems.slice();
  beginSession({day:session.day,label:session.label+' · 다시',words:session.words,queue:shuffle(items),review:session.review});
};
$('againBtn').onclick=()=>{ if(session.day!=null)startQuiz(session.day);else startReview(); };
$('homeBtn').onclick=()=>{show('home');renderChips();};
$('synStudyBtn').onclick=openSynStudy;
$('synQuizBtn').onclick=startSynQuiz;
$('synBackBtn').onclick=()=>{show('home');renderChips();};

/* =====================================================================
   NAV
   ===================================================================== */
function show(name){
  $('home').style.display = name==='home'?'block':'none';
  $('quiz').style.display = name==='quiz'?'flex':'none';
  $('result').style.display = name==='result'?'block':'none';
  $('syn').style.display = name==='syn'?'block':'none';
  window.scrollTo(0,0);
}

/* =====================================================================
   BACKUP / RESTORE / RESET
   ===================================================================== */
$('exportBtn').onclick=()=>{
  const data=JSON.stringify(store);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href=url;a.download=`워마단어_진행상황_${stamp}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      if(obj&&(obj.mastered||obj.wrongPool)){
        store={mastered:obj.mastered||{},wrongPool:obj.wrongPool||{}};
        // 불러온 데이터도 새 형식으로 맞춰줌
        for(const eng in store.wrongPool){
          const v=store.wrongPool[eng];
          if(typeof v==='string') store.wrongPool[eng]={kor:v,hint:findHint(eng),correct:0};
          else if(v&&typeof v.correct!=='number') v.correct=0;
        }
        save();renderChips();
        alert('진행상황을 불러왔어요! ✅');
      }else alert('올바른 백업 파일이 아니에요.');
    }catch(err){alert('파일을 읽을 수 없어요.');}
    $('importFile').value='';
  };
  rd.readAsText(f);
};
$('resetBtn').onclick=()=>{
  if(confirm('모든 학습 기록을 지울까요?\n(아는 단어·틀린 단어가 모두 초기화됩니다)')){
    store={mastered:{},wrongPool:{}};save();renderChips();
    alert('기록을 초기화했어요.');
  }
};

/* boot */
(async function(){ await load(); renderChips(); loadMembers(); })();
</script>
